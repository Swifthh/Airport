mode: rule
log-level: warning
proxy-providers:
  Airport1:
    url: "https://api-huacloud.dev/sub?target=clash&insert=true&emoji=true&udp=true&clash.doh=true&new_name=true&filename=Flower_Trojan.yaml&url=https%3A%2F%2Fapi.xmancdn.com%2Fosubscribe.php%3Ftoken2%3Dzyve82eq-f0cc965711eeq7ud3f"
    type: http
    interval: 86400
  Airport2:
    url: "https://161.129.35.81/?L1N1YnNjcmlwdGlvbi9DbGFzaD90PTIwMjImc2lkPTc0MDMwJnRva2VuPTUyNDBmNTYzY2FjYThmJm1tPTg0MTE2Jmt0bW09SW94dk5mWElaSFNoK0hBK1BkRXRIUT09JiZtbT04NDExNiZrdG1tPUlveHZOZlhJWkhTeGtubCUyZjdVQVJBdyUzZCUzZCYyZGQwODI5MjY5YTE0ZmM0YmNi"
    type: http
    interval: 86400
dns:
  default-nameserver:
    - tls://223.5.5.5
  nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  enable: true
  ipv6: false
  enhanced-mode: fake-ip
  fake-ip-range: 198.18.0.1/16
  fake-ip-filter:
    - "*"
    - +.lan
    - +.local
    - time.*.com
    - ntp.*.com
    - +.market.xiaomi.com
  use-hosts: false
  use-system-hosts: false
  respect-rules: false
  proxy-server-nameserver:
    - https://doh.pub/dns-query
    - https://dns.alidns.com/dns-query
  direct-nameserver: []
  fallback: []
  fallback-filter:
    geoip: true
    geoip-code: CN
    ipcidr:
      - 240.0.0.0/4
      - 0.0.0.0/32
    domain:
      - +.google.com
      - +.facebook.com
      - +.youtube.com
proxy-groups:
  #功能分组
  - name: PROXY
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Proxy.png
    type: select
    proxies:
      - 香港(HK)
      - 台灣(TW)
      - 新加坡(SG)
      - 日本(JP)
      - 美國(US)
      - 其他地區(Others)
  - name: PayPal
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/PayPal.png
    type: select
    proxies:
      - 美國(US)
  - name: Spotify
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/Spotify.png
    type: select
    proxies:
      - PROXY
      - 其他地區(Others)
  #地区分组
  - name: 香港(HK)
    filter: (?i)\bHK\b|Hong\s?Kong|香港
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Hong_Kong.png
    type: url-test
    interval: 3600
    tolerance: 50
    lazy: true
    include-all: true
  - name: 台灣(TW)
    filter: (?i)\bTW\b|Taiwan|台湾
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Taiwan.png
    type: url-test
    interval: 3600
    tolerance: 50
    lazy: true
    include-all: true
  - name: 新加坡(SG)
    filter: (?i)\bSG\b|Singapore|新加坡|狮城
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Singapore.png
    type: url-test
    interval: 3600
    tolerance: 50
    lazy: true
    include-all: true
  - name: 日本(JP)
    filter: (?i)\bJP\b|Japan|日本
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/Japan.png
    type: url-test
    interval: 3600
    tolerance: 50
    lazy: true
    include-all: true
  - name: 美國(US)
    filter: (?i)\bUS\b|USA|United\s?States|美国
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure/IconSet/Color/United_States.png
    type: url-test
    interval: 3600
    tolerance: 50
    lazy: true
    include-all: true
  - name: 其他地區(Others)
    filter: ^(?!.*(?i)(\bHK\b|Hong\s?Kong|香港|\bTW\b|Taiwan|台湾|\bSG\b|Singapore|新加坡|狮城|\bJP\b|Japan|日本|\bUS\b|USA|United\s?States|美国|\bExpire\b|\bTraffic\b|时间|流量)).*$
    icon: https://fastly.jsdelivr.net/gh/Koolson/Qure@master/IconSet/Color/World_Map.png
    type: select
    include-all: true
rules:
  #打卡签到
  - DOMAIN-KEYWORD,weizhi.host,DIRECT
  #Steam
  - RULE-SET,steamcn_rules,DIRECT
  #直连
  - RULE-SET,cn_rules,DIRECT
  - RULE-SET,cnip_rules,DIRECT
  #分流服务
  - RULE-SET,paypal_rules,PayPal
  - RULE-SET,spotify_rules,Spotify
  #默认
  - MATCH,PROXY
rule-anchor:
  domain: &domain { type: http, interval: 86400, behavior: domain, format: mrs }
  ipcidr: &ipcidr { type: http, interval: 86400, behavior: ipcidr, format: mrs }
  # classical: &classical {type: http, interval: 86400, behavior: classical, format: text}
rule-providers:
  cn_rules:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/cn.mrs"
    path: ./ruleset/cn_rules.mrs
  cnip_rules:
    <<: *ipcidr
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geoip/cn.mrs"
    path: ./ruleset/cnip_rules.mrs
  paypal_rules:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/paypal.mrs"
    path: ./ruleset/paypal_rules.mrs
  spotify_rules:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/spotify.mrs"
    path: ./ruleset/spotify_rules.mrs
  steamcn_rules:
    <<: *domain
    url: "https://raw.githubusercontent.com/MetaCubeX/meta-rules-dat/meta/geo/geosite/steam@cn.mrs"
    path: ./ruleset/steamcn_rules.mrs
